name: site-health-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call health check endpoint
        run: |
          curl -sfL -X GET "https://zanovo.co.za/api/site-health-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
