name: site-health-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call health check endpoint
        run: |
          status=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X GET \
            "https://www.zanovo.co.za/api/site-health-check" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $status"
          cat /tmp/response.txt
          echo
          if [ "$status" != "200" ]; then
            echo "::error::site-health-check endpoint returned HTTP $status"
            exit 1
          fi
